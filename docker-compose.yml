# Development compose: builds the image locally from this checkout. For
# production, use docker-compose.deploy.yml which pulls from GHCR.

services:
  batinapapka:
    build: .
    image: batinapapka:latest
    container_name: batinapapka
    restart: unless-stopped

    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:?set BRAVE_API_KEY in .env or shell}
      CRON_SCHEDULE: "0 3 * * *"

    volumes:
      # Mount any number of host folders here. The image's default command
      # is `--recursive /videos`, so subdirectories are picked up too.
      - ./videos:/videos
      # - /mnt/media/movies:/videos/movies
      # - /mnt/nas/clips:/videos/clips

      - batinapapka_state:/state

volumes:
  batinapapka_state:
