# Development compose: builds the image locally from this checkout. For
# production, use docker-compose.deploy.yml which pulls from GHCR.

services:
  batinapapka:
    # Tagging the locally-built image as ghcr.io/davnozdu/batinapapka means
    # the same compose works for either flow:
    #   docker compose build      → builds from this checkout, retags GHCR
    #   docker compose pull       → pulls the published image instead
    #   docker compose up         → tries pull first; if absent, builds
    build: .
    image: ghcr.io/davnozdu/batinapapka:latest
    container_name: batinapapka
    restart: unless-stopped

    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:?set BRAVE_API_KEY in .env or shell}
      CRON_SCHEDULE: "0 3 * * *"

    volumes:
      # Mount any number of host folders here. The image's default command
      # is `--recursive /videos`, so subdirectories are picked up too.
      - ./videos:/videos
      # - /mnt/media/movies:/videos/movies
      # - /mnt/nas/clips:/videos/clips

      - batinapapka_state:/state

volumes:
  batinapapka_state:
