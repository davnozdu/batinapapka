# Combined deployment: batinapapka renamer + cyberdrop-dl + SSH side-car.
# Pulls the prebuilt image from GHCR — no local build, no apt-get on startup.
#
# Quick start:
#   curl -fsSL https://raw.githubusercontent.com/davnozdu/batinapapka/main/batinapapka_cyberdrop-dl.yaml -o docker-compose.yml
#   curl -fsSL https://raw.githubusercontent.com/davnozdu/batinapapka/main/.env.example                  -o .env
#   $EDITOR .env                  # set BRAVE_API_KEY, SHELL_USER, SHELL_PASSWORD
#   $EDITOR docker-compose.yml    # mount your video folder(s) under `volumes:`
#   docker compose pull
#   docker compose up -d
#   ssh -p 2222 "${SHELL_USER}"@host   # `cyberdrop-dl` is on PATH inside

services:
  batinapapka_cyberdrop:
    image: ghcr.io/davnozdu/batinapapka-cyberdrop:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: batinapapka_cyberdrop
    restart: unless-stopped

    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:?set BRAVE_API_KEY in .env or shell}
      CRON_SCHEDULE: "0 3 * * *"
      SHELL_USER: ${SHELL_USER:?set SHELL_USER in .env or shell}
      SHELL_PASSWORD: ${SHELL_PASSWORD:?set SHELL_PASSWORD in .env or shell}

    ports:
      - "2222:22"     # ssh -p 2222 <SHELL_USER>@host

    volumes:
      # Mount any number of host folders under /videos. The default command
      # is `--recursive /videos`, so subdirectories are processed too.
      - ./videos:/videos
      # - /mnt/media/movies:/videos/movies
      # - /mnt/nas/clips:/videos/clips
      - batinapapka_state:/state

volumes:
  batinapapka_state:
