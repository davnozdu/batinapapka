# Production deployment: pulls the prebuilt image from GHCR.
#
# Quick start:
#   curl -fsSL https://raw.githubusercontent.com/davnozdu/batinapapka/main/docker-compose.deploy.yml -o docker-compose.yml
#   curl -fsSL https://raw.githubusercontent.com/davnozdu/batinapapka/main/.env.example       -o .env
#   $EDITOR .env                  # fill BRAVE_API_KEY
#   $EDITOR docker-compose.yml    # mount your video folder(s) — see below
#   docker compose pull
#   docker compose up -d

services:
  batinapapka:
    image: ghcr.io/davnozdu/batinapapka:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: batinapapka
    restart: unless-stopped

    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:?set BRAVE_API_KEY in .env or shell}
      # Empty CRON_SCHEDULE makes the container run once and exit. Default
      # is daily at 03:00. Override via .env if you want a different cadence.
      CRON_SCHEDULE: "0 3 * * *"

    volumes:
      # Mount any number of host folders here. The image's default command
      # is `--recursive /videos`, so anything under /videos (including
      # subdirectories) gets processed.
      #
      # Single-folder layout:
      - ./videos:/videos
      #
      # Multi-folder layout — uncomment and edit:
      # - /mnt/media/movies:/videos/movies
      # - /mnt/nas/clips:/videos/clips
      # - /home/me/downloads:/videos/downloads

      # Persistent state: cache, log, renamed-files index. Survives recreate.
      - batinapapka_state:/state

volumes:
  batinapapka_state:
